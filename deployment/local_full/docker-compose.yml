name: social-network
services:
  traefik:
    image: "traefik:v3.4"
    container_name: "social-network-traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - social-network
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
  go-app:
    build:
      context: ../../
      dockerfile: deployment/local_full/golang/Dockerfile
    container_name: go-app
    networks:
      - social-network
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.go-app.rule=Host(`localhost`)"
  db:
    image: "postgres:16-alpine"
    container_name: "social-network-db"
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - social-network
    env_file:
      - ./.env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db:
  redis:
networks:
  social-network:
