name: social-network
services:
  traefik:
    image: "traefik:v3.4"
    container_name: "social-network-traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - social-network
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
  db:
    image: "postgres:16-alpine"
    container_name: "social-network-db"
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - social-network
    env_file:
      - ./.env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db:
  redis:
networks:
  social-network:
